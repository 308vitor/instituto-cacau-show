<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Saiba como ajudar o Instituto Cacau Show a transformar a Páscoa de crianças.">
    <title>Como ajudar | Instituto Cacau Show</title>
    <link rel="stylesheet" href="/css/comoAjudar.css">
</head>

<body>
    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a class="logo-link" href="#" aria-label="Página inicial do Instituto Cacau Show">
                <img src="/assests/logo_header.svg" alt="Instituto Cacau Show">
            </a>

            <button class="menu-botao" id="menuBotao" type="button" aria-label="Abrir menu" aria-expanded="false"
                aria-controls="menuPrincipal">
                ☰
            </button>

            <nav class="navegacao" id="menuPrincipal" aria-label="Navegação principal">
                <a href="#inicio">Início</a>
                <a href="#sobre">Sobre nós</a>
                <a class="ativo" href="#ajudar" aria-current="page">Como ajudar</a>
            </nav>

            <a class="botao-doe" href="#doacao">Doe agora</a>
        </div>
    </header>
    <main>
        <section class="hero" id="inicio" aria-labelledby="titulo-hero">
            <div class="hero-overlay"></div>
            <div class="container hero-conteudo">
                <h1 id="titulo-hero">Existem várias formas<br>de espalhar alegria.</h1>
                <p>
                    Nesta Páscoa, você pode fazer parte dessa transformação.
                    Escolha uma forma de ajudar e contribua para levar momentos
                    especiais a mais crianças.
                </p>
            </div>
        </section>
</body>

</html>
